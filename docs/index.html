<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F Clean Feed – Ad &amp; Reels blocker for Facebook™</title>
<meta name="description" content="Hide sponsored posts, suggestions, Reels and Stories on Facebook™. Free, private, no account.">

<meta property="og:description" content="Ad & Reels blocker for Facebook™. Free, private, no account.">

<style>
  :root {
    --bg: #f4f6f9; --card: #ffffff; --fg: #0f1b2d; --muted: #5b6b80; --faint: #8a98ab; --line: #e6eaf0;
    --navy: #0b1f3a; --navy2: #12355e; --accent: #10b981; --accent-ink: #047857; --accent-soft: #e7f8f1;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b1220; --card: #121b2c; --fg: #e8edf4; --muted: #9aa8bb; --faint: #6e7d92; --line: #1f2a3d; --accent: #34d399; --accent-ink: #34d399; --accent-soft: rgba(52,211,153,.12); }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }

  nav { display: flex; align-items: center; gap: 12px; padding: 18px 0; }
  nav .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; text-decoration: none; letter-spacing: -.01em; }
  nav .brand img { width: 32px; height: 32px; border-radius: 8px; }
  nav .spacer { flex: 1; }
  nav a.plain { color: var(--muted); text-decoration: none; font-size: 15px; }
  nav a.plain:hover { color: var(--fg); }
  .lang { border: 1px solid var(--line); background: var(--card); color: var(--muted); border-radius: 8px; padding: 4px 10px; font: inherit; font-size: 14px; cursor: pointer; }

  .hero { display: grid; grid-template-columns: 1.05fr .95fr; gap: 48px; align-items: center; padding: 48px 0 64px; }
  .eyebrow { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-ink); font-size: 14px; font-weight: 600; }
  .eyebrow i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  h1 { font-size: clamp(36px, 5.2vw, 58px); line-height: 1.06; letter-spacing: -.03em; margin: 18px 0 18px; }
  .lead { font-size: clamp(17px, 1.6vw, 20px); color: var(--muted); margin: 0 0 30px; max-width: 34em; }
  .cta { display: flex; flex-wrap: wrap; gap: 12px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; border-radius: 10px; font-weight: 600; text-decoration: none; font-size: 16px; border: 1px solid transparent; }
  .btn.primary { background: var(--navy2); color: #fff; }
  .btn.primary:hover { background: var(--navy); }
  @media (prefers-color-scheme: dark) { .btn.primary { background: var(--accent); color: #062b1f; } .btn.primary:hover { filter: brightness(1.08); } }
  .btn.ghost { border-color: var(--line); background: var(--card); color: var(--fg); }
  .btn.ghost:hover { border-color: var(--faint); }
  .btn small { font-weight: 500; color: inherit; opacity: .7; }
  .note { margin-top: 14px; font-size: 14px; color: var(--faint); }
  .shot { width: 100%; height: auto; border-radius: 16px; border: 1px solid var(--line); box-shadow: 0 30px 80px rgba(11, 31, 58, .16); display: block; }

  section { padding: 56px 0; border-top: 1px solid var(--line); }
  h2 { font-size: clamp(26px, 3vw, 34px); letter-spacing: -.02em; margin: 0 0 8px; }
  .sub { color: var(--muted); margin: 0 0 32px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px; }
  .card svg { width: 26px; height: 26px; color: var(--accent-ink); }
  .card h3 { font-size: 17px; margin: 12px 0 6px; }
  .card p { margin: 0; color: var(--muted); font-size: 15px; }

  .shots { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .shots img { width: 100%; height: auto; border-radius: 12px; border: 1px solid var(--line); display: block; }

  ol.steps { margin: 0; padding-left: 22px; color: var(--muted); }
  ol.steps li { margin: 6px 0; }
  ol.steps b, ol.steps code { color: var(--fg); }
  code { font: 14px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--line); padding: 1px 6px; border-radius: 5px; }

  .promo { display: flex; align-items: center; gap: 18px; text-decoration: none; padding: 22px 24px; }
  .promo:hover { border-color: var(--accent); }
  .promo .ico { width: 48px; height: 48px; flex: none; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-ink); }
  .promo .ico svg { width: 24px; height: 24px; color: inherit; }
  .promo b { display: block; font-size: 18px; }
  .promo span { color: var(--muted); }
  .promo .go { margin-left: auto; font-size: 22px; color: var(--faint); }

  footer { padding: 36px 0 48px; border-top: 1px solid var(--line); color: var(--faint); font-size: 14px; }
  footer .row { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-bottom: 10px; }
  footer a { color: var(--muted); text-decoration: none; }
  footer a:hover { color: var(--fg); text-decoration: underline; }

  @media (max-width: 860px) {
    .hero { grid-template-columns: 1fr; padding-top: 24px; gap: 32px; }
    .grid { grid-template-columns: 1fr; }
    .shots { grid-template-columns: 1fr; }
    nav a.plain { display: none; }
    .promo { flex-wrap: wrap; }
    .promo .go { display: none; }
  }
</style>
</head>
<body>

<script>
  const T = {
    vi: {
      langBtn: "English", navFeatures: "Tính năng", navInstall: "Cài đặt",
      eyebrow: "Miễn phí · Không cần tài khoản",
      h1: "Bảng tin Facebook™ gọn gàng, không nhiễu.",
      lead: "F Clean Feed tự động ẩn bài được tài trợ, bài gợi ý, Reels và Tin. Chỉ còn bạn bè và những trang bạn thực sự theo dõi.",
      download: "Tải bản mới nhất", store: "Chrome Web Store", soon: "· sắp có",
      note: "Dành cho Google Chrome và các trình duyệt Chromium (Edge, Brave, Cốc Cốc).",
      featTitle: "Mọi thứ bạn cần để lướt yên tĩnh", featSub: "13 tuỳ chọn, mỗi tuỳ chọn một công tắc. Có hiệu lực ngay, không cần tải lại trang.",
      f1t: "Chặn quảng cáo", f1: "Bài được tài trợ trong bảng tin, quảng cáo cột phải, Marketplace và kết quả tìm kiếm.",
      f2t: "Ẩn Reels và Tin", f2: "Bỏ khay Reels và thanh Tin. Muốn thì vẫn giữ Reels do bạn bè chia sẻ.",
      f3t: "Bớt gợi ý", f3: "\"Gợi ý cho bạn\", \"Những người bạn có thể biết\" và nhóm gợi ý.",
      f4t: "Không nháy quảng cáo", f4: "Bài được nhận diện ngay khi tải, trước khi trình duyệt kịp vẽ lên màn hình.",
      f5t: "Chế độ gọn", f5: "Ẩn hai cột bên ở trang chủ để bảng tin nằm giữa, dễ tập trung hơn.",
      f6t: "Riêng tư tuyệt đối", f6: "Không máy chủ, không analytics, không mã bên thứ ba. Chỉ chạy trên facebook.com.",
      instTitle: "Cài đặt", instSub: "Trong lúc chờ Chrome Web Store duyệt, bạn có thể cài thủ công trong một phút:",
      s1: "Tải file <b>f-clean-feed-…zip</b> ở trang <a href=\"https://github.com/viennv96/f-clean-feed/releases/latest\">Releases</a> và giải nén.",
      s2: "Mở <code>chrome://extensions</code> và bật <b>Developer mode</b> (góc trên bên phải).",
      s3: "Bấm <b>Load unpacked</b> và chọn thư mục vừa giải nén.",
      s4: "Tải lại facebook.com. Xong!",
      promoT: "Cần VPS tốc độ cao?", promo: "Thuê VPS ổn định, giá tốt tại viennv.dev",
      by: "Phát triển bởi", privacy: "Chính sách quyền riêng tư", support: "Hỗ trợ",
      tm: "Facebook là thương hiệu của Meta Platforms, Inc. F Clean Feed là dự án độc lập, không liên kết hay được Meta bảo trợ.",
    },
    en: {
      langBtn: "Tiếng Việt", navFeatures: "Features", navInstall: "Install",
      eyebrow: "Free · No account",
      h1: "Your Facebook™ feed, without the noise.",
      lead: "F Clean Feed automatically hides sponsored posts, suggestions, Reels and Stories. Just the people and pages you actually follow.",
      download: "Download latest", store: "Chrome Web Store", soon: "· coming soon",
      note: "For Google Chrome and Chromium browsers (Edge, Brave and others).",
      featTitle: "Everything you need for a quiet feed", featSub: "13 controls, one switch each. Changes apply instantly, no reload.",
      f1t: "Ad blocking", f1: "Sponsored posts in the feed, right-column ads, Marketplace and search result ads.",
      f2t: "Hide Reels & Stories", f2: "Drop the Reels trays and Stories bar. Optionally keep reels shared by friends.",
      f3t: "Fewer suggestions", f3: "\"Suggested for you\", People You May Know and suggested groups.",
      f4t: "No ad flicker", f4: "Units are recognised as they load, before the browser paints them.",
      f5t: "Clean mode", f5: "Hide both side columns on the home page for a focused, centred feed.",
      f6t: "Private by design", f6: "No servers, no analytics, no third-party code. Runs only on facebook.com.",
      instTitle: "Install", instSub: "While the Chrome Web Store review is pending, install it manually in a minute:",
      s1: "Download <b>f-clean-feed-…zip</b> from <a href=\"https://github.com/viennv96/f-clean-feed/releases/latest\">Releases</a> and unzip it.",
      s2: "Open <code>chrome://extensions</code> and turn on <b>Developer mode</b> (top right).",
      s3: "Click <b>Load unpacked</b> and pick the unzipped folder.",
      s4: "Reload facebook.com. Done!",
      promoT: "Need a fast VPS?", promo: "Reliable VPS hosting at viennv.dev",
      by: "Made by", privacy: "Privacy policy", support: "Support",
      tm: "Facebook is a trademark of Meta Platforms, Inc. F Clean Feed is an independent project and is not affiliated with or endorsed by Meta.",
    },
  };
  // Strings with markup are authored above, never taken from the URL or user input.
  const HTML_KEYS = new Set(["s1", "s2", "s3", "s4"]);
  let lang;
  try { lang = localStorage.getItem("fcf-lang"); } catch (e) {}
  if (!T[lang]) lang = (navigator.language || "").toLowerCase().startsWith("vi") ? "vi" : "en";
  function apply() {
    document.documentElement.lang = lang;
    for (const el of document.querySelectorAll("[data-t]")) {
      const v = T[lang][el.dataset.t];
      if (HTML_KEYS.has(el.dataset.t)) el.innerHTML = v; else el.textContent = v;
    }
    for (const img of document.querySelectorAll("[data-img]")) img.src = `assets/${lang}-${img.dataset.img}.png`;
    document.getElementById("lang").textContent = T[lang].langBtn;
  }
  document.getElementById("lang").addEventListener("click", () => {
    lang = lang === "vi" ? "en" : "vi";
    try { localStorage.setItem("fcf-lang", lang); } catch (e) {}
    apply();
  });
  apply();
</script>
