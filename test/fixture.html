<script>
const feed = document.getElementById('feed');
function withFiber(el, props) {
  // Fake fiber: element -> child component carrying the props.
  const child = { memoizedProps: props, child: null, sibling: null };
  el['__reactFiber$test'] = { memoizedProps: { className: 'u' }, child, sibling: null, return: null };
}
function unit(id, html, props) {
  const d = document.createElement('div'); d.id = id;
  d.innerHTML = html + '<div>' + '<span>x</span>'.repeat(10) + '</div>';
  if (props) withFiber(d, props);
  feed.appendChild(d);
}
unit('organic', '<h4>Alice</h4><p>Hello world</p>', { feedEdge: { category: 'ORGANIC' } });
unit('spon-fiber', '<h4>Brand X</h4><span>S p o n</span>', { feedEdge: { category: 'SPONSORED' } });
unit('spon-data', '<h4>Brand Y</h4>', { story: { node: { sponsored_data: { id: 1 } } } });
unit('spon-label', '<span id="lbl">Được tài trợ</span><a aria-labelledby="lbl" href="#">.</a>');
unit('suggested', '<h4>Suggested for you</h4><p>Some page</p>');
unit('pymk', '<h4>Những người bạn có thể biết</h4>');
unit('groups', '<a href="/groups/discover/">See all</a>');
unit('reels', '<h4>Reels and short videos</h4><a href="/reel/1">a</a>');
unit('reels-fiber', '<h4>Bob</h4>', { feedEdge: { category: 'FB_SHORTS' } });
unit('friend-reel', '<h4>Carol shared</h4><a href="/reel/9">a</a><p>nice</p>');
document.getElementById('rail').innerHTML =
  '<div id="rail-ad"><div><h3>Sponsored</h3><a href="https://ads.example">ad</a></div></div>' +
  '<div id="rail-bday"><h3>Sinh nhật</h3><a href="/events/birthdays">Hôm nay là sinh nhật của Dũng</a></div>' +
  '<div id="rail-contacts"><h3>Contacts</h3><a href="/c">c</a></div>';
// Marketplace-style grid: one sponsored card by props, one by label, two organic.
const grid = document.getElementById('grid');
grid.innerHTML =
  '<div id="m-organic"><a href="/marketplace/item/1"><img alt="">Bike</a></div>' +
  '<div id="m-fiber"><a href="/marketplace/item/2"><img alt="">Shoes</a></div>' +
  '<div id="m-label"><a href="https://shop.example"><img alt=""><span>Sponsored</span></a></div>' +
  '<div id="m-organic2"><a href="/marketplace/item/3"><img alt="">Desk</a></div>';
withFiber(grid.querySelector('#m-fiber a'), { listing: { is_sponsored: true } });

window.msgs = []; addEventListener('message', e => e.data && e.data.__fbc && msgs.push(e.data.kind));
// Reels tray whose heading is a link to /reels/.
unit('linked-reels', '<a href="/reels/"><span dir="auto">Reels</span></a><div role="link">r</div>');
// Skeleton unit whose Reels heading arrives later.
unit('late-reels', '<div></div>');
setTimeout(() => { document.getElementById('late-reels').insertAdjacentHTML('afterbegin', '<h3>Reels</h3><div role="link">r</div>'); }, 3000);
setTimeout(() => unit('late-spon', '<h4>Late</h4>', { feedEdge: { category: 'SPONSORED' } }), 800);
</script>
<script src="../content/main.js"></script>
