<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="top">
    <img class="logo" src="../icons/48.png" alt="" width="32" height="32" />
    <div class="brand">
      <h1 data-i18n="shortName"></h1>
      <p class="status"><i></i><span id="status"></span></p>
    </div>
    <div class="seg lang" role="radiogroup" aria-label="Ngôn ngữ / Language">
      <button role="radio" data-lang="vi" lang="vi" title="Tiếng Việt">VI</button>
      <button role="radio" data-lang="en" lang="en" title="English">EN</button>
    </div>
    <label class="switch big">
      <input type="checkbox" id="enabled" />
      <span></span>
    </label>
  </header>

  <section class="card update" id="update" hidden>
    <div class="update-head">
      <b id="update-title"></b>
      <a id="update-notes" target="_blank" rel="noopener" data-i18n="updateNotes"></a>
    </div>
    <ol class="update-steps">
      <li><a id="update-download" class="update-btn" target="_blank" rel="noopener" data-i18n="updateDownload"></a></li>
      <li data-i18n="updateUnzip"></li>
      <li><button id="update-reload" class="update-btn ghost" data-i18n="updateReload"></button></li>
    </ol>
  </section>

  <section class="card stats">
    <div class="total">
      <b id="total">0</b>
      <span data-i18n="statsTotal"></span>
    </div>
    <span class="today" id="today"></span>
    <ul class="breakdown">
      <li><b id="b-ads">0</b><span data-i18n="statsAds"></span></li>
      <li><b id="b-suggested">0</b><span data-i18n="statsSuggested"></span></li>
      <li><b id="b-reels">0</b><span data-i18n="statsReels"></span></li>
    </ul>
  </section>

  <section class="mode">
    <span data-i18n="modeLabel"></span>
    <div class="seg" role="radiogroup">
      <button role="radio" data-mode="hide" data-i18n="modeHide"></button>
      <button role="radio" data-mode="collapse" data-i18n="modeCollapse"></button>
    </div>
  </section>

  <div id="kinds"></div>

  <a class="card promo" href="https://viennv.dev" target="_blank" rel="noopener">
    <img class="promo-logo" src="../icons/mmovps.png" alt="MMO VPS" width="32" height="32" />
    <span class="promo-text">
      <b data-i18n="promoTitle"></b>
      <small data-i18n="promoText"></small>
    </span>
    <span class="promo-go" aria-hidden="true">→</span>
  </a>

  <footer>
    <button id="version" class="ver" type="button"></button>
    <span class="dot">·</span>
    <span data-i18n="footerPrivacy"></span>
    <button id="reset" class="link" data-i18n="statsReset"></button>
  </footer>
  <p class="author"><span data-i18n="authorBy"></span> <a href="https://viennv.dev" target="_blank" rel="noopener">Nguyễn Văn Viên</a></p>

  <template id="kind-row">
    <label class="row">
      <span class="ico"></span>
      <span class="name"></span>
      <small class="count"></small>
      <span class="switch"><input type="checkbox" /><span></span></span>
    </label>
  </template>

  <script type="module" src="popup.js"></script>
</body>
</html>
